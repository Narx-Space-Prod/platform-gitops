name: Read-only verification

on:
  workflow_call:
    outputs:
      deploy:
        value: ${{ jobs.observe.outputs.deploy }}
    inputs:
      timeout-seconds:
        default: 1200
        type: number
      environment:
        default: ''
        type: string
      release-id:
        default: ''
        type: string
      operation:
        default: wait
        type: string

permissions:
  contents: read

jobs:
  observe:
    name: Verify trusted evidence
    if: github.repository == 'Narx-Space-Prod/platform-gitops' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.operation == 'wait' || inputs.operation == 'observe-production') && 65 || 35 }}
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source or deployment evidence
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NARX_DEPLOYMENT_BOT_LOGIN: ${{ vars.NARX_DEPLOYMENT_BOT_LOGIN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: ${{ inputs.release-id }}
          WAIT_TIMEOUT: ${{ inputs.timeout-seconds }}
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            tests|quality|publication) python3 scripts/source_gate.py "$OPERATION" ;;
            wait) python3 scripts/delivery.py wait "$TARGET_ENVIRONMENT" --bundle "$RELEASE_ID" --timeout "$WAIT_TIMEOUT" ;;
            observe-production) python3 scripts/delivery.py observe-production ;;
            *) echo 'Unsupported verification operation.' >&2; exit 1 ;;
          esac
