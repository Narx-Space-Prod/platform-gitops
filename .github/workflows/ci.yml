name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/workflows.yml@e94e5e70af3edaf124cd7fbe86ec76f36160fdbf
  helm:
    uses: Narx-Space-Prod/platform-ci/.github/workflows/helm.yml@e94e5e70af3edaf124cd7fbe86ec76f36160fdbf
  preview:
    name: Local preview configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate developer preview configuration
        run: docker compose --env-file local/.env.example -f local/compose.yaml config --quiet
      - name: Validate integration-test Python syntax
        run: python3 -m py_compile tests/test_local_stack.py
