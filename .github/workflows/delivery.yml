name: 02 - Commerce Delivery
run-name: >-
  Delivery | ${{ github.event_name == 'pull_request' && format('Production PR {0}', github.event.pull_request.number) || format('Intake {0}', github.run_number) }}

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  pull_request:
    types: [closed]
    branches: [main]
    paths: [environments/production/release.json]

permissions:
  contents: read

# One writer owns Dev/QA progression. Production observation is read-only and
# must not wait behind a later release while a reviewer merges its approved PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'production-observation' || 'release-operations' }}
  cancel-in-progress: false

jobs:
  dev:
    name: 01 - Verify releases and prepare Dev
    if: github.repository == 'Narx-Space-Prod/platform-gitops' && vars.DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/delivery-stage.yml
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
    with:
      environment: dev
  verify-dev:
    name: 02 - Dev rollout and smoke gate
    needs: dev
    if: needs.dev.outputs.active == 'true'
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/delivery-observe.yml
    with:
      environment: dev
      release-id: ${{ needs.dev.outputs.release-id }}
  qa:
    name: 03 - Promote the verified bundle to QA
    needs: [dev, verify-dev]
    if: needs.dev.outputs.active == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/delivery-stage.yml
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
    with:
      environment: qa
      release-id: ${{ needs.dev.outputs.release-id }}
  verify-qa:
    name: 04 - QA rollout and smoke gate
    needs: [dev, qa]
    if: needs.dev.outputs.active == 'true'
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/delivery-observe.yml
    with:
      environment: qa
      release-id: ${{ needs.dev.outputs.release-id }}
  production-pr:
    name: 05 - Request Production PR approval
    needs: [dev, verify-qa]
    if: needs.dev.outputs.active == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/delivery-stage.yml
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
    with:
      environment: production
      release-id: ${{ needs.dev.outputs.release-id }}
  production:
    name: 06 - Approved Production rollout and smoke gate
    if: github.repository == 'Narx-Space-Prod/platform-gitops' && vars.DELIVERY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/delivery-observe.yml
    with:
      environment: production
      operation: observe-production
  summary:
    name: Delivery overview and next action
    needs: [dev, verify-dev, qa, verify-qa, production-pr, production]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish the single entrypoint overview
        env:
          STAGES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          stages=json.loads(os.environ['STAGES'])
          dev=stages['dev'].get('outputs',{})
          production=stages['production-pr'].get('outputs',{})
          labels={'dev':'Prepare immutable Dev release','verify-dev':'Dev deployment + smoke',
                  'qa':'Promote QA','verify-qa':'QA deployment + smoke',
                  'production-pr':'Request Production PR approval','production':'Observe approved Production deployment'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('## Commerce delivery\n\n')
              if dev.get('release-id'):
                  output.write('Release: `'+dev['release-id']+'`\n\n')
              output.write('| Stage | Job result |\n| --- | --- |\n')
              for key,label in labels.items():
                  output.write(f"| {label} | {stages[key]['result']} |\n")
              if production.get('pr-url'):
                  output.write('\n[Production approval PR]('+production['pr-url']+'). Production is not marked deployed by this request; after merge, its rollout appears as a linked continuation in this same workflow.\n')
              if dev.get('active')=='false':
                  output.write('\nNo new promotion is needed: the current bundle already has trusted healthy evidence in all environments.\n')
              output.write('\n[All Commerce Delivery runs](https://github.com/Narx-Space-Prod/platform-gitops/actions/workflows/delivery.yml) · [Recovery](https://github.com/Narx-Space-Prod/platform-gitops/actions/workflows/recovery.yml)\n')
          PY
