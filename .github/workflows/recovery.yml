name: 03 - Recovery

on:
  repository_dispatch:
    types: [recovery-requested]
  pull_request:
    types: [closed]
    branches: [main]
    paths: [environments/production/release.json]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, qa, production]
        default: qa

permissions:
  contents: read

jobs:
  recovery:
    name: Verify failure and propose rollback
    if: >-
      github.repository == 'Narx-Space-Prod/platform-gitops' &&
      vars.DELIVERY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'repository_dispatch' &&
        github.event.sender.login == 'narx-local-commerce-release[bot]' &&
        github.event.sender.id == 352511280 &&
        contains(fromJSON('["qa","production"]'), github.event.client_payload.environment)))
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-release-stage.yml
    secrets:
      NARX_RELEASE_APP_PRIVATE_KEY: ${{ secrets.NARX_RELEASE_APP_PRIVATE_KEY }}
    with:
      environment: ${{ inputs.environment || github.event.client_payload.environment }}
      operation: ${{ github.event_name == 'workflow_dispatch' && 'rollback' || 'recover' }}
  production-observation:
    name: Verify manually approved Production release
    if: github.repository == 'Narx-Space-Prod/platform-gitops' && vars.DELIVERY_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    uses: ./.github/workflows/reusable-verify.yml
    with:
      environment: production
      operation: observe-production
