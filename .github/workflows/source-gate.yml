name: Read-only source CI gate
on:
  workflow_call:
    outputs:
      deploy:
        value: ${{ jobs.evidence.outputs.deploy }}
    inputs:
      gate:
        required: true
        type: string
permissions:
  contents: read
jobs:
  evidence:
    name: Verify source CI evidence
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Observe actual source jobs without rebuilding
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ inputs.gate }}
        run: python3 scripts/source_gate.py "$GATE"
