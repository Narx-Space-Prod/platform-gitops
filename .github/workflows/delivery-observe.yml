name: Reusable deployment observation

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release-id:
        default: ''
        type: string
      operation:
        default: wait
        type: string

permissions:
  contents: read

jobs:
  observe:
    name: Observe rollout and smoke proof
    if: github.repository == 'Narx-Space-Prod/platform-gitops' && github.ref == 'refs/heads/main' && vars.DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Wait for the exact bundle and trusted smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NARX_DEPLOYMENT_BOT_LOGIN: ${{ vars.NARX_DEPLOYMENT_BOT_LOGIN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: ${{ inputs.release-id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            wait) python3 scripts/delivery.py wait "$TARGET_ENVIRONMENT" --bundle "$RELEASE_ID" ;;
            observe-production) python3 scripts/delivery.py observe-production ;;
            *) echo 'Unsupported observation operation.' >&2; exit 1 ;;
          esac
