name: Trusted release verification

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verify:
    name: Verify candidate release identities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      packages: read
    steps:
      # SECURITY: checkout only the reviewed base commit. Never checkout, import or execute candidate code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Mark verification pending and fetch only candidate release JSON as data
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=pending -f context=narx/release-verification -f description='Checking immutable release policy'
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          root = 'repos/' + os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',root + '/pulls/' + os.environ['PR_NUMBER'] + '/files?per_page=100'],text=True))
          files = [entry for page in pages for entry in page]
          import sys
          sys.path.insert(0, 'scripts')
          from delivery import validate_review_scope
          pr = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['pull_request']
          validate_review_scope(files, pr['user'], pr['head']['repo']['full_name'])
          allowed = {'environments/'+e+'/release.json' for e in ['dev','qa','production']}
          candidates = []
          for entry in files:
              if entry.get('previous_filename') in allowed and entry['filename'] != entry['previous_filename']:
                  raise SystemExit('Release state cannot be renamed')
              if entry['filename'] not in allowed:
                  continue
              if entry['status'] == 'removed':
                  raise SystemExit('Release state cannot be deleted')
              data = api(root + '/contents/' + entry['filename'] + '?ref=' + os.environ['HEAD_SHA'])
              raw = base64.b64decode(data['content'], validate=False)
              if len(raw) > 65536:
                  raise SystemExit('Release JSON exceeds size limit')
              value = json.loads(raw)
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / ('candidate-' + str(len(candidates)) + '.json')
              path.write_text(json.dumps(value))
              candidates.append({'path': str(path), 'environment': entry['filename'].split('/')[1]})
          pathlib.Path(os.environ['RUNNER_TEMP'],'candidates.json').write_text(json.dumps(candidates))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('changed=' + str(bool(candidates)).lower() + '\n')
          PY
      - name: Require activated GHCR verification for deployable release changes
        if: steps.candidate.outputs.changed == 'true'
        env:
          DELIVERY_ENABLED: ${{ vars.DELIVERY_ENABLED }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for candidate in json.loads(Path(os.environ['RUNNER_TEMP'],'candidates.json').read_text()):
              value=json.loads(Path(candidate['path']).read_text())
              if value.get('release',{}).get('ready') and os.environ['DELIVERY_ENABLED'] != 'true':
                  raise SystemExit('Deployable release is blocked until GHCR verification is activated')
          PY
      - name: Authenticate read-only GHCR verification
        if: steps.candidate.outputs.changed == 'true' && vars.DELIVERY_ENABLED == 'true'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/narx-docker-verify"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.candidate.outputs.changed == 'true' && vars.DELIVERY_ENABLED == 'true'
        with:
          cosign-release: v3.1.4
      - name: Install the pinned manifest parser
        if: steps.candidate.outputs.changed == 'true'
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Apply trusted policy to candidate JSON
        if: steps.candidate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NARX_DEPLOYMENT_BOT_LOGIN: ${{ vars.NARX_DEPLOYMENT_BOT_LOGIN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          for candidate in json.loads(Path(os.environ['RUNNER_TEMP'],'candidates.json').read_text()):
              subprocess.run(['python3','scripts/delivery.py','verify-candidate',candidate['path'], '--environment',candidate['environment'], '--revision',os.environ['BASE_SHA']], check=True)
          PY
      - name: Publish verification result on the candidate commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f "state=$state" -f context=narx/release-verification -f description='Trusted immutable release validation'
      - name: Remove temporary registry login
        if: always()
        run: if [ -n "${DOCKER_CONFIG:-}" ]; then rm -rf "$DOCKER_CONFIG"; fi
