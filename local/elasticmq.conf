include classpath("application.conf")
node-address {
  protocol = http
  host = elasticmq
  port = 9324
}
rest-stats.enabled = false
aws {
  region = us-east-1
  accountId = "000000000000"
}
# Keep queue state through container restarts. Removing the named volume loses it.
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}
queues {
  order-paid {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "order-paid-dlq"
      maxReceiveCount = 5
    }
  }
  order-paid-dlq { }
}
