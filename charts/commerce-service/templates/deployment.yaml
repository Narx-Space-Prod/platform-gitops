{{- if and .Values.autoscaling.enabled (lt (int .Values.autoscaling.maxReplicas) (int .Values.autoscaling.minReplicas)) }}
{{- fail "autoscaling.maxReplicas must be at least autoscaling.minReplicas" }}
{{- end }}
apiVersion: {{ ternary "argoproj.io/v1alpha1" "apps/v1" .Values.progressive.enabled }}
kind: {{ ternary "Rollout" "Deployment" .Values.progressive.enabled }}
metadata:
  name: {{ include "commerce-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ include "commerce-service.fullname" . }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  strategy:
    {{- if .Values.progressive.enabled }}
    blueGreen:
      activeService: {{ include "commerce-service.fullname" . }}
      previewService: {{ include "commerce-service.fullname" . }}-preview
      autoPromotionEnabled: true
      scaleDownDelaySeconds: {{ .Values.progressive.scaleDownDelaySeconds }}
      scaleDownDelayRevisionLimit: 1
      abortScaleDownDelaySeconds: 30
      prePromotionAnalysis:
        templates: [{templateName: {{ include "commerce-service.fullname" . }}-verify}]
        args: [{name: target-url, value: {{ printf "http://%s-preview" (include "commerce-service.fullname" .) | quote }}}]
      postPromotionAnalysis:
        templates: [{templateName: {{ include "commerce-service.fullname" . }}-verify}]
        args: [{name: target-url, value: {{ printf "http://%s" (include "commerce-service.fullname" .) | quote }}}]
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ include "commerce-service.fullname" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: narx-commerce
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ include "commerce-service.fullname" . }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "commerce-service.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- $pullSecrets := .Values.imagePullSecrets }}
      {{- if hasKey .Values.global "imagePullSecrets" }}
      {{- $pullSecrets = .Values.global.imagePullSecrets }}
      {{- end }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            failureThreshold: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
