{{- if .Values.progressive.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "commerce-service.fullname" . }}-verify
spec:
  args: [{name: target-url}]
  metrics:
    - name: frontend-availability
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            ttlSecondsAfterFinished: 3600
            template:
              metadata:
                labels: {app.kubernetes.io/name: commerce-analysis}
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                {{- $pullSecrets := .Values.imagePullSecrets }}
                {{- if hasKey .Values.global "imagePullSecrets" }}
                {{- $pullSecrets = .Values.global.imagePullSecrets }}
                {{- end }}
                {{- with $pullSecrets }}
                imagePullSecrets:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
                securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
                containers:
                  - name: verify
                    image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
                    env:
                      - name: TARGET_URL
                        value: {{ "{{args.target-url}}" | quote }}
                    command: [node, --input-type=module, -e]
                    args:
                      - |
                        import assert from 'node:assert/strict';
                        const base = process.env.TARGET_URL;
                        async function get(path) {
                          const response = await fetch(base + path, {signal: AbortSignal.timeout(5000)});
                          assert.equal(response.status, 200, path + ' must return 200');
                          return response;
                        }
                        const deadline = Date.now() + 80000;
                        for (let round = 0; round < 3;) {
                          try {
                            await get('/health/ready');
                            const page = await (await get('/')).text();
                            assert.ok(page.includes('<html'), 'Storefront HTML is missing');
                            const products = await (await get('/api/products')).json();
                            assert.ok(Array.isArray(products) && products.length > 0);
                            assert.ok(products.every(p => p.currency === 'INR' && p.price > 0));
                            round++;
                          } catch (error) {
                            if (Date.now() >= deadline) throw error;
                            round = 0;
                          }
                          await new Promise(resolve => setTimeout(resolve, 5000));
                        }
                        console.log('progressive_frontend_check_passed');
                    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
                    resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 96Mi}}
{{- end }}
