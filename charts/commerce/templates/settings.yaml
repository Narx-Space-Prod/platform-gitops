{{- $access := .Values.global.publicAccess | default dict }}
{{- $origin := .Values.publicOrigin }}
{{- $secure := .Values.cookieSecure }}
{{- if hasKey $access "origin" }}{{- $origin = $access.origin }}{{- end }}
{{- if hasKey $access "secureCookies" }}{{- $secure = $access.secureCookies }}{{- end }}
{{- if .Values.release.ready }}
{{- if not .Values.localData.enabled }}
{{- if or (not (hasPrefix "https://" $origin)) (empty .Values.awsRegion) (not $secure) (empty .Values.externalDataCIDRs) }}
{{- fail "managed-data deployments require HTTPS origin, AWS region, secure cookies and private data CIDRs" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-settings
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  PUBLIC_ORIGIN: {{ required "publicOrigin is required" $origin | quote }}
  COOKIE_SECURE: {{ $secure | quote }}
  AWS_REGION: {{ .Values.awsRegion | quote }}
  DELIVERY_LOCAL: {{ .Values.localData.enabled | quote }}
  DELIVERY_ENDPOINT: {{ ternary "http://elasticmq:9324" "" .Values.localData.enabled | quote }}
{{- end }}
