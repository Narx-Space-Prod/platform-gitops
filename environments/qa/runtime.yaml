environment: qa
global:
  publicAccess:
    origin: https://narx-qa.narx.space
    secureCookies: true
localData:
  enabled: true
  storageClass: standard
frontend:
  progressive:
    enabled: true
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
rolloutsController:
  enabled: true
  ciliumAPI: true
