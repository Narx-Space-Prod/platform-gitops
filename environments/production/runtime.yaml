global:
  imagePullSecrets: []
podIdentity: {enabled: true}
# Populate reviewed VPC/subnet CIDRs for RDS and the chosen Redis endpoint.
externalDataCIDRs: []
environment: production
publicOrigin: ""
cookieSecure: true
awsRegion: ""
localData: {enabled: false}
catalogue: &capacity
  replicaCount: 2
  podDisruptionBudget: {enabled: true, minAvailable: 1}
frontend:
  <<: *capacity
  progressive: {enabled: true}
cart: *capacity
orders: *capacity
publisher: *capacity
worker: *capacity
rolloutsController: {enabled: true}
