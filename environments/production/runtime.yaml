environment: production
global:
  publicAccess:
    origin: https://narx-prod.narx.space
    secureCookies: true
podIdentity:
  enabled: false
externalDataCIDRs: []
awsRegion: us-east-1
localData:
  enabled: true
  storageClass: standard
frontend:
  replicaCount: 2
  progressive:
    enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
rolloutsController:
  enabled: true
  ciliumAPI: true
